[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.6.0"
description = "Auditable daily-bar paper research, starting with deterministic accounting"
requires-python = ">=3.11"
dependencies = ["tzdata==2026.3"]

[project.scripts]
quant-research = "quant_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_research = ["resources/*.csv", "resources/*.json", "resources/*.html", "resources/*.css", "resources/*.js"]

name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install build tools and declared dependencies
        run: python -m pip install "setuptools>=68" wheel -e .
      - name: Unit, integration and wheel tests
        run: python -m unittest discover -s tests -v
      - name: Checkout entry point
        run: python run.py demo --output var/ci-demo
